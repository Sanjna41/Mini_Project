databases:
  - name: exam-duty-db
    plan: free
    databaseName: examduty
    user: examduty

services:
  - type: web
    name: exam-duty-manager
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ExamDutyManager.wsgi:application
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: exam-duty-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
