<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin:18px 0;font-size:14px">
{% for label,value in details %}<tr><td style="width:38%;border:1px solid #dbe3ec;background:#f8fafc;padding:10px;font-weight:700;vertical-align:top">{{ label }}</td><td style="border:1px solid #dbe3ec;padding:10px;line-height:1.5;vertical-align:top">{{ value|linebreaksbr }}</td></tr>{% endfor %}
</table>
